<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palamut Avcısı</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(to bottom, #7dd3fc, #38bdf8); /* Gökyüzü */
            color: #1e293b;
            user-select: none;
            overflow-x: hidden;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
        }

        /* Oyunlaştırılmış Arka Plan Süsleri */
        .forest-bg {
            position: fixed;
            bottom: 0; left: 0; width: 100%; height: 40vh;
            background: linear-gradient(to bottom, #86efac, #22c55e);
            border-radius: 40% 60% 0 0 / 20% 30% 0 0;
            z-index: -1;
            box-shadow: inset 0 20px 20px rgba(255,255,255,0.2);
        }

        /* UI Panelleri */
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.1), inset 0 0 0 4px rgba(255,255,255,0.5);
            border: 3px solid #bae6fd;
        }

        /* İlerleme Çubuğu (XP Bar) */
        .xp-bar-container {
            width: 100%;
            height: 20px;
            background-color: #cbd5e1;
            border-radius: 10px;
            box-shadow: inset 0 3px 5px rgba(0,0,0,0.1);
            position: relative;
        }
        
        .xp-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #f59e0b, #fbbf24);
            width: 0%;
            border-radius: 10px;
            transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }

        .xp-bar-fill::after {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

        /* Kombo Efekti */
        .combo-text {
            color: #ef4444;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
            animation: flamePulse 0.5s infinite alternate;
        }
        @keyframes flamePulse { 0% { transform: scale(1); filter: drop-shadow(0 0 3px #fca5a5); } 100% { transform: scale(1.1); filter: drop-shadow(0 0 10px #ef4444); } }

        /* Yandan Açılan Konuşma Balonu (Yer kazanmak için) */
        .speech-bubble {
            position: relative;
            background: #fff;
            border-radius: 20px;
            padding: 12px 20px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
            border: 3px solid #e2e8f0;
        }
        .speech-bubble::after {
            content: ''; position: absolute;
            left: -12px; top: 50%; transform: translateY(-50%);
            border-width: 10px 15px 10px 0;
            border-style: solid;
            border-color: transparent #fff transparent transparent;
            z-index: 1;
        }
        .speech-bubble::before {
            content: ''; position: absolute;
            left: -16px; top: 50%; transform: translateY(-50%);
            border-width: 13px 18px 13px 0;
            border-style: solid;
            border-color: transparent #e2e8f0 transparent transparent;
        }

        /* -------------------------------------
           Palamut Tasarımları (Kritik Güncelleme)
           ------------------------------------- */
        .blocks-wrapper { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; align-items: center; width: 100%; }
        
        .birlik-area { 
            display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; 
            max-width: 150px; 
        }
        
        /* 10'luk Kule -> 3 Sütunlu 3-3-3-1 Yapısına Dönüştü */
        .onluk-kule {
            display: grid; 
            grid-template-columns: repeat(3, 1fr); /* 3 sütunlu yapı */
            gap: 2px;
            background: #fef3c7; padding: 6px; border-radius: 16px;
            border: 2px solid #fde68a; box-shadow: 2px 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s;
            justify-items: center;
        }
        .onluk-kule:hover { transform: translateY(-3px) scale(1.02); }

        /* Yüzlük Kasa -> Daha derli toplu */
        .yuzluk-kasa {
            display: grid; grid-template-columns: repeat(10, 1fr); gap: 1px;
            background: #ffedd5; padding: 6px; border-radius: 16px;
            border: 3px solid #fdba74; box-shadow: 4px 6px 12px rgba(0,0,0,0.15);
            transition: transform 0.3s;
            justify-items: center;
        }
        .yuzluk-kasa:hover { transform: scale(1.03); }

        /* Oyun Butonları (Ahşap Tabela) */
        .wood-btn {
            background: linear-gradient(to bottom, #d97706, #b45309);
            color: white;
            border: 3px solid #78350f;
            border-radius: 16px;
            box-shadow: 0 6px 0 #78350f, 0 10px 15px rgba(0,0,0,0.2);
            transition: all 0.1s;
            text-shadow: 0 2px 2px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
        }
        .wood-btn::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 30%;
            background: rgba(255,255,255,0.1); border-radius: 16px 16px 0 0;
        }
        .wood-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 0 #78350f, 0 15px 20px rgba(0,0,0,0.2); }
        .wood-btn:active { transform: translateY(6px); box-shadow: 0 0px 0 #78350f, 0 3px 5px rgba(0,0,0,0.2); }

        /* Animasyonlar */
        .pop-in { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popIn { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        .shake { animation: shake 0.3s ease-in-out; filter: grayscale(100%); }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px) rotate(-2deg); } 75% { transform: translateX(6px) rotate(2deg); } }

        .correct-btn { background: linear-gradient(to bottom, #22c55e, #16a34a) !important; border-color: #14532d !important; box-shadow: 0 6px 0 #14532d !important; animation: bounce 0.4s; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px) scale(1.05); } }

        /* Uçan Puan */
        .floating-score {
            position: absolute; color: #f59e0b; font-weight: 900; font-size: 2rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3), 0 0 8px white;
            pointer-events: none; animation: floatUp 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; z-index: 50;
        }
        @keyframes floatUp { 0% { transform: translateY(0) scale(0.5); opacity: 1; } 100% { transform: translateY(-80px) scale(1.5); opacity: 0; } }

    </style>
</head>
<body class="p-2 md:p-6 justify-center">
    
    <div class="forest-bg"></div>

    <!-- 1. BAŞLANGIÇ EKRANI -->
    <div id="screen-start" class="glass-panel w-full max-w-xl mx-auto p-8 flex flex-col items-center text-center pop-in z-10">
        <div class="relative mb-4">
            <img src="images/sincap.png" onerror="this.src='https://placehold.co/150/f97316/FFF?text=SINCAP'" class="w-32 h-32 md:w-40 md:h-40 object-contain drop-shadow-xl animate-bounce">
            <img src="images/mesepalamudu.png" onerror="this.style.display='none'" class="w-12 h-12 md:w-16 md:h-16 absolute -bottom-2 -right-2 drop-shadow-md">
        </div>
        <h1 class="text-4xl md:text-5xl font-black text-sky-800 mb-3 drop-shadow-sm">Palamut Avcısı</h1>
        <p class="text-lg md:text-xl text-slate-600 mb-6 font-bold">Kışlık palamutlarımı saymama yardım eder misin?</p>
        
        <button onclick="startGame()" class="text-2xl md:text-3xl font-black bg-emerald-500 hover:bg-emerald-400 text-white py-4 px-12 rounded-full shadow-[0_6px_0_#047857] active:shadow-[0_0px_0_#047857] active:translate-y-[6px] transition-all">
            <i class="fa-solid fa-play mr-2"></i> Başla
        </button>
    </div>

    <!-- 2. OYUN EKRANI -->
    <div id="screen-game" class="hidden w-full max-w-4xl mx-auto flex flex-col gap-3 md:gap-5 z-10">
        
        <!-- Üst Bar: İlerleme ve Puan -->
        <div class="glass-panel p-3 md:p-4 flex flex-col gap-3">
            <div class="flex justify-between items-center px-1">
                <div class="flex items-center gap-2 md:gap-3">
                    <div class="w-10 h-10 md:w-12 md:h-12 bg-amber-100 rounded-full flex items-center justify-center border-2 md:border-4 border-amber-300">
                        <i class="fa-solid fa-star text-amber-500 text-lg md:text-xl"></i>
                    </div>
                    <div>
                        <p class="text-slate-400 text-[10px] md:text-xs font-bold uppercase tracking-wider">SKORUN</p>
                        <p class="text-2xl md:text-3xl font-black text-amber-500 leading-none" id="score-display">0</p>
                    </div>
                </div>
                
                <div id="combo-display" class="hidden flex items-center gap-1 md:gap-2 combo-text text-lg md:text-2xl font-black">
                    <i class="fa-solid fa-fire"></i> X<span id="combo-multiplier">2</span>
                </div>
            </div>

            <div class="xp-bar-container">
                <div class="xp-bar-fill" id="progress-bar"></div>
                <img src="images/sincap.png" onerror="this.src='https://placehold.co/30/f97316/FFF?text=S'" id="progress-icon" class="absolute top-1/2 -translate-y-1/2 -ml-3 md:-ml-4 w-6 h-6 md:w-8 md:h-8 object-contain transition-all duration-500" style="left: 0%;">
            </div>
        </div>

        <!-- Sincap Diyalog Alanı (Dikeyde yer kazandıran YAN YANA tasarım) -->
        <div class="flex items-center justify-center gap-3 md:gap-5 z-20 mx-auto">
            <img src="images/sincap.png" onerror="this.src='https://placehold.co/100/f97316/FFF?text=SINCAP'" class="w-16 h-16 md:w-20 md:h-20 object-contain drop-shadow-lg">
            <div class="speech-bubble">
                <p class="text-sm md:text-lg font-bold text-slate-700" id="squirrel-text">Burada kaç palamut var?</p>
            </div>
        </div>

        <!-- Görsel Sayı Alanı (Palamutlar) -->
        <div class="glass-panel p-4 md:p-8 min-h-[220px] md:min-h-[280px] flex items-center justify-center flex-1">
            <div id="blocks-container" class="blocks-wrapper pop-in">
                <!-- JS ile yüzlük, onluk ve birlikler buraya çizilecek -->
            </div>
        </div>

        <!-- Şıklar -->
        <div id="choices-container" class="grid grid-cols-3 gap-3 md:gap-5">
            <!-- JS ile butonlar eklenecek -->
        </div>
    </div>

    <!-- 3. BİTİŞ EKRANI -->
    <div id="screen-end" class="hidden glass-panel w-full max-w-xl mx-auto p-8 flex flex-col items-center text-center mt-10 z-10">
        <div class="relative w-full flex justify-center mb-4">
            <img src="images/sincap.png" onerror="this.src='https://placehold.co/150/f97316/FFF?text=SINCAP'" class="w-32 h-32 md:w-40 md:h-40 object-contain animate-bounce z-10">
            <img src="images/mesepalamudu.png" onerror="this.style.display='none'" class="absolute w-10 top-0 left-6 animate-ping opacity-50">
            <img src="images/mesepalamudu.png" onerror="this.style.display='none'" class="absolute w-12 bottom-6 right-6 animate-pulse opacity-70">
        </div>
        <h2 class="text-4xl md:text-5xl font-black text-amber-500 mb-2 drop-shadow-md">Kışa Hazırız!</h2>
        <p class="text-lg md:text-xl text-slate-600 mb-6 font-bold">Harika saydın ve beni doyurdun!</p>
        
        <div class="bg-amber-100 w-full rounded-3xl p-4 md:p-6 mb-6 border-4 border-amber-300 shadow-inner">
            <p class="text-lg text-amber-700 font-bold mb-1 uppercase tracking-widest">Kazanılan Puan</p>
            <p class="text-6xl md:text-7xl font-black text-amber-500 drop-shadow-sm" id="final-score">100</p>
        </div>

        <button onclick="location.reload()" class="text-2xl font-black bg-sky-500 hover:bg-sky-400 text-white py-4 px-12 rounded-full shadow-[0_6px_0_#0284c7] active:shadow-[0_0px_0_#0284c7] active:translate-y-[6px] transition-all">
            <i class="fa-solid fa-rotate-right mr-2"></i> Baştan Oyna
        </button>
    </div>

    <script>
        const questions = [
            { h: 0, t: 1, o: 3, answer: 13, options: [13, 31, 103] },
            { h: 0, t: 2, o: 5, answer: 25, options: [25, 52, 205] },
            { h: 0, t: 3, o: 0, answer: 30, options: [30, 3, 33] },
            { h: 0, t: 4, o: 2, answer: 42, options: [42, 24, 402] },
            { h: 0, t: 1, o: 8, answer: 18, options: [18, 81, 108] },
            { h: 0, t: 5, o: 5, answer: 55, options: [55, 50, 5] },
            { h: 0, t: 6, o: 1, answer: 61, options: [61, 16, 601] },
            { h: 0, t: 3, o: 9, answer: 39, options: [39, 93, 309] },
            { h: 0, t: 7, o: 4, answer: 74, options: [74, 47, 704] },
            { h: 0, t: 2, o: 8, answer: 28, options: [28, 82, 208] },
            { h: 0, t: 8, o: 0, answer: 80, options: [80, 8, 88] },
            { h: 0, t: 4, o: 7, answer: 47, options: [47, 74, 407] },
            { h: 0, t: 9, o: 2, answer: 92, options: [92, 29, 902] },
            { h: 0, t: 5, o: 9, answer: 59, options: [59, 95, 509] },
            { h: 0, t: 9, o: 9, answer: 99, options: [99, 90, 9] },
            { h: 1, t: 2, o: 4, answer: 124, options: [124, 142, 120] },
            { h: 2, t: 0, o: 5, answer: 205, options: [205, 250, 25] },
            { h: 1, t: 5, o: 0, answer: 150, options: [150, 105, 15] },
            { h: 3, t: 1, o: 2, answer: 312, options: [312, 321, 132] },
            { h: 2, t: 4, o: 8, answer: 248, options: [248, 284, 428] }
        ];

        const PALAMUT_SRC = "images/mesepalamudu.png";
        const PLACEHOLDER = "https://placehold.co/40/f97316/FFF?text=P";
        
        let currentQIndex = 0;
        let score = 0;
        let consecutiveCorrect = 0;
        let isAnswering = false;

        const dialogues = [
            "Hmm, sence burada kaç palamut var?",
            "Karnım çok aç! Sayıyı bulabilir misin?",
            "Kaç tane olduklarını çözebilecek misin?",
            "Onluklara dikkat et dostum!",
            "Sence doğru sepet hangisi?"
        ];

        let audioInitialized = false;
        let correctSynth, wrongSynth, comboSynth;

        async function initAudio() {
            if (audioInitialized) return;
            await Tone.start();
            correctSynth = new Tone.PolySynth(Tone.Synth, {
                oscillator: { type: 'sine' }, envelope: { attack: 0.05, decay: 0.1, sustain: 0.3, release: 1 }
            }).toDestination();
            correctSynth.volume.value = -5;

            wrongSynth = new Tone.Synth({
                oscillator: { type: 'sawtooth' }, envelope: { attack: 0.01, decay: 0.2, sustain: 0, release: 0.2 }
            }).toDestination();
            wrongSynth.volume.value = -12;

            comboSynth = new Tone.PolySynth(Tone.Synth).toDestination();
            comboSynth.volume.value = -2;
            audioInitialized = true;
        }

        function playCorrect(isCombo) {
            if (!audioInitialized) return;
            const now = Tone.now();
            if(isCombo) comboSynth.triggerAttackRelease(["C5", "E5", "G5", "C6"], "8n", now);
            else correctSynth.triggerAttackRelease(["E5", "C6"], "16n", now);
        }

        function playWrong() {
            if (!audioInitialized) return;
            wrongSynth.triggerAttackRelease("C3", "8n");
        }

        async function startGame() {
            await initAudio();
            document.getElementById('screen-start').classList.add('hidden');
            document.getElementById('screen-game').classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            isAnswering = false;
            const q = questions[currentQIndex];
            
            const progressPercent = (currentQIndex / questions.length) * 100;
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;
            document.getElementById('progress-icon').style.left = `${progressPercent}%`;

            document.getElementById('squirrel-text').innerText = dialogues[Math.floor(Math.random() * dialogues.length)];
            
            renderBlocks(q.h, q.t, q.o);
            
            const shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);
            const choicesContainer = document.getElementById('choices-container');
            choicesContainer.innerHTML = '';
            
            shuffledOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "wood-btn text-3xl md:text-5xl font-black py-4 md:py-6 w-full";
                btn.innerHTML = `<span class="relative z-10">${opt}</span>`;
                btn.onclick = (e) => handleAnswer(opt, q.answer, btn, e);
                choicesContainer.appendChild(btn);
            });
        }

        function renderBlocks(hundreds, tens, ones) {
            const container = document.getElementById('blocks-container');
            container.innerHTML = ''; 
            
            // Yüzlükler
            for (let i = 0; i < hundreds; i++) {
                const kasa = document.createElement('div');
                kasa.className = 'yuzluk-kasa';
                for(let j=0; j<100; j++) {
                    const img = document.createElement('img');
                    img.src = PALAMUT_SRC;
                    // Yüzlük içindeki palamutlar minik olur
                    img.className = 'w-2 h-2 md:w-3 md:h-3 object-contain opacity-90';
                    img.onerror = function() { this.src = PLACEHOLDER; };
                    kasa.appendChild(img);
                }
                container.appendChild(kasa);
            }

            // Onluklar (3-3-3-1 yapısı ile dev görseller)
            for (let i = 0; i < tens; i++) {
                const kule = document.createElement('div');
                kule.className = 'onluk-kule';
                for(let j=0; j<10; j++) {
                    const img = document.createElement('img');
                    img.src = PALAMUT_SRC;
                    // Eskisinden ÇOK daha büyük: w-6 h-6, tablet için w-8 h-8
                    img.className = 'w-6 h-6 md:w-8 md:h-8 object-contain drop-shadow-sm';
                    img.onerror = function() { this.src = PLACEHOLDER; };
                    kule.appendChild(img);
                }
                container.appendChild(kule);
            }

            // Birlikler (Ayrı ve Kocaman)
            if (ones > 0) {
                const birlikArea = document.createElement('div');
                birlikArea.className = 'birlik-area';
                for(let j=0; j<ones; j++) {
                    const img = document.createElement('img');
                    img.src = PALAMUT_SRC;
                    // Birlikler kocaman: w-10 h-10, tablet için w-12 h-12
                    img.className = 'w-10 h-10 md:w-12 md:h-12 object-contain drop-shadow-md';
                    img.onerror = function() { this.src = PLACEHOLDER; };
                    birlikArea.appendChild(img);
                }
                container.appendChild(birlikArea);
            }

            container.classList.remove('pop-in');
            void container.offsetWidth; 
            container.classList.add('pop-in');
        }

        function handleAnswer(selected, correct, btnElement, event) {
            if (isAnswering) return;
            isAnswering = true;

            const comboDisplay = document.getElementById('combo-display');
            const multiplierSpan = document.getElementById('combo-multiplier');

            if (selected === correct) {
                consecutiveCorrect++;
                let pointsEarned = 10;
                let isCombo = false;

                if(consecutiveCorrect >= 3) {
                    isCombo = true;
                    pointsEarned = 20; 
                    comboDisplay.classList.remove('hidden');
                    multiplierSpan.innerText = consecutiveCorrect >= 5 ? "3" : "2";
                    if(consecutiveCorrect >= 5) pointsEarned = 30; 
                }

                score += pointsEarned;
                document.getElementById('score-display').innerText = score;
                playCorrect(isCombo);
                
                btnElement.classList.add('correct-btn');
                document.getElementById('squirrel-text').innerText = "Harika! Doğru bildin.";

                showFloatingScore(event.clientX, event.clientY, `+${pointsEarned}`);

                setTimeout(() => {
                    nextQuestion();
                }, 1200);

            } else {
                consecutiveCorrect = 0; 
                comboDisplay.classList.add('hidden');
                
                playWrong();
                btnElement.classList.add('shake');
                document.getElementById('squirrel-text').innerText = "Ups! Bir daha sayalım.";
                
                setTimeout(() => {
                    btnElement.classList.remove('shake');
                    isAnswering = false;
                }, 600);
            }
        }

        function showFloatingScore(x, y, text) {
            const el = document.createElement('div');
            el.className = 'floating-score';
            el.innerText = text;
            
            if(x === undefined || x === 0) {
                el.style.left = '50%';
                el.style.top = '50%';
            } else {
                el.style.left = `${x - 20}px`;
                el.style.top = `${y - 20}px`;
            }

            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1000);
        }

        function nextQuestion() {
            currentQIndex++;
            if (currentQIndex < questions.length) {
                loadQuestion();
            } else {
                endGame();
            }
        }

        function endGame() {
            document.getElementById('progress-bar').style.width = `100%`;
            document.getElementById('progress-icon').style.left = `100%`;

            setTimeout(() => {
                document.getElementById('screen-game').classList.add('hidden');
                document.getElementById('screen-end').classList.remove('hidden');
                document.getElementById('final-score').innerText = score;
                
                if (audioInitialized) {
                    const now = Tone.now();
                    correctSynth.triggerAttackRelease("C5", "8n", now);
                    correctSynth.triggerAttackRelease("E5", "8n", now + 0.2);
                    correctSynth.triggerAttackRelease("G5", "8n", now + 0.4);
                    correctSynth.triggerAttackRelease("C6", "2n", now + 0.6);
                }
            }, 500);
        }
    </script>
</body>
</html>
